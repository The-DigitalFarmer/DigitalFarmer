<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-brand">
      <a href="#inicio" aria-label="DigitalFarmer, inicio">
        <img src="/assets/svg/avatar.svg" alt="" width="44" height="44">
        <strong>RecklessCode</strong>
      </a>
      <p>Python, APIs y automatización</p>
    </div>
    <nav class="footer-column" aria-label="Explorar el portafolio">
      <h3>EXPLORAR</h3>
      {% for section in navigation[1:5] %}
      <a href="#{{ section.id }}">{{ section.label }}</a>
      {% endfor %}
    </nav>
    <nav class="footer-column" aria-label="Canales de contacto">
      <h3>CONECTEMOS</h3>
      {% for channel in channels %}
      <a href="{{ channel.href }}"{% if channel.href.startswith('https:') %} target="_blank" rel="noopener noreferrer"{% endif %}>
        {{ channel.label }} <span aria-hidden="true">↗</span>
      </a>
      {% endfor %}
    </nav>
  </div>
  <div class="footer-meta" id="footer-meta">
    <span class="footer-name">Reckless Foundation</span>
    <span class="footer-copyright">© <span id="year">{{ year }}</span></span>
    <a class="footer-back-top" href="#inicio">
      <img class="footer-back-top-icon" src="/assets/png/reacklessIcon.png" alt=""
           width="72" height="48" loading="lazy" decoding="async">
      <span>Volver al inicio <span aria-hidden="true">↑</span></span>
    </a>
  </div>
</footer>
