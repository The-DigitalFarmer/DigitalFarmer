<header class="header">
  <div class="header-inner">
    <a class="brand" href="#inicio" aria-label="DigitalFarmer, inicio">
      <img src="/assets/svg/avatar.svg" alt="" width="32" height="32">
      <span>Reckless</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Abrir menú de navegación"
            aria-expanded="false" aria-controls="main-navigation" hidden>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <nav id="main-navigation" aria-label="Navegación principal">
      {% for section in navigation %}
      <a href="#{{ section.id }}"{% if loop.first %} class="nav-active" aria-current="location"{% endif %}>{{ section.label }}</a>
      {% endfor %}
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Modo oscuro"
            aria-pressed="false" title="Activar modo oscuro" hidden>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1 9 9 0 1 0 20.9 13.2Z"></path>
      </svg>
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
    </button>
  </div>
</header>
