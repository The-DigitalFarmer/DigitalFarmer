<section
  class="contact-section section-surface"
  id="contacto"
  aria-labelledby="contact-title"
>
  <p class="section-kicker">CONTACT</p>
  <div class="contact-layout">
    <div class="contact-copy">
      <h2 class="section-title" id="contact-title">
        Hablemos de tu<br>
        <span>próxima idea.</span>
      </h2>
      <p class="contact-description">
        ¿Tienes un proyecto en mente o un reto por resolver? Hablemos de
        cómo puedo aportar desde el backend.
      </p>
    </div>
    <nav class="contact-channels" aria-label="Canales de contacto">
      <a
        class="contact-channel contact-channel--gmail"
        href="mailto:cabreralandayersondimer@gmail.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Escribir a Yerson en Gmail"
      >
        <span class="channel-top">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M3 5h18v14H3Zm0 1 9 7 9-7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="miter"
            />
          </svg>
          <span aria-hidden="true">↗</span>
        </span>
        <strong>Gmail</strong>
        <span class="channel-caption">Escríbeme</span>
      </a>
      <a
        class="contact-channel"
        href="https://wa.me/51980822924?text=Hola+Yerson%2C+vi+tu+portafolio+y+me+gustar%C3%ADa+conversar+sobre+una+idea."
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Conversar con Yerson en WhatsApp"
      >
        <span class="channel-top">
          {{ social_logo("whatsapp") }}
          <span aria-hidden="true">↗</span>
        </span>
        <strong>WhatsApp</strong>
        <span class="channel-caption">Conversemos</span>
      </a>
      <a
        class="contact-channel"
        href="https://www.linkedin.com/in/yerson-cabrera-88439b401/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver el perfil de Yerson en LinkedIn"
      >
        <span class="channel-top">
          {{ social_logo("linkedin") }}
          <span aria-hidden="true">↗</span>
        </span>
        <strong>LinkedIn</strong>
        <span class="channel-caption">Conectemos</span>
      </a>
    </nav>
  </div>
</section>
